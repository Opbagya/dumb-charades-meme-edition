<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="dubOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="60%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#E03A00"/>
    </linearGradient>
    <filter id="dubShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Mascot Blob Body with ears/bumps like DubDub character -->
  <path d="M 32 30 
           C 24 16, 40 8, 52 20 
           C 62 10, 80 14, 86 28 
           C 98 24, 108 38, 104 54 
           C 112 72, 104 94, 88 102 
           C 72 108, 44 108, 28 100 
           C 12 90, 8 68, 16 50 
           C 12 38, 20 28, 32 30 Z" 
        fill="url(#dubOrangeGrad)" 
        stroke="#121316" 
        stroke-width="5" 
        stroke-linejoin="round"
        filter="url(#dubShadow)" />

  <!-- Animated / Cool Sunglasses -->
  <!-- Left lens -->
  <path d="M 22 46 Q 38 42 54 48 Q 50 66 32 66 Q 20 64 22 46 Z" 
        fill="#121316" 
        stroke="#FFFFFF" 
        stroke-width="2.5"/>
  <!-- Right lens -->
  <path d="M 62 48 Q 78 42 94 46 Q 96 64 84 66 Q 66 66 62 48 Z" 
        fill="#121316" 
        stroke="#FFFFFF" 
        stroke-width="2.5"/>
  <!-- Sunglasses bridge -->
  <path d="M 52 48 Q 58 45 64 48" 
        stroke="#FFFFFF" 
        stroke-width="3" 
        stroke-linecap="round"/>
  <!-- Sunglass reflections -->
  <path d="M 28 50 L 36 60" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 68 50 L 76 60" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Expressive Smile / Grin -->
  <path d="M 44 80 Q 58 92 72 80" 
        stroke="#121316" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        fill="none"/>

  <!-- Cute Rosy Cheek Highlights -->
  <ellipse cx="28" cy="74" rx="5" ry="3" fill="#FF8855" opacity="0.8"/>
  <ellipse cx="88" cy="74" rx="5" ry="3" fill="#FF8855" opacity="0.8"/>
</svg>
